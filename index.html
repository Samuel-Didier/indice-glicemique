<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#F8F4ED"><title>Indice — Le carnet glycémique</title><style>
:root{--cream:#F8F4ED;--ink:#1A1A1A;--red:#B31B1B;--low:#28634b;--mid:#a66a12;--high:#a62222}*{box-sizing:border-box}body{margin:0;background:var(--cream);color:var(--ink);font:16px system-ui,sans-serif}main{max-width:1100px;margin:auto;padding:28px 18px}header{border-bottom:2px solid var(--ink);padding-bottom:22px;margin-bottom:22px}h1,h2{font-family:Georgia,serif;margin:.15em 0}h1{font-size:clamp(2.4rem,7vw,5rem);line-height:.95}h1 em{color:var(--red);font-style:normal}.eyebrow{letter-spacing:.13em;text-transform:uppercase;font-size:.75rem;font-weight:700}.intro{max-width:650px;line-height:1.55}.controls{display:grid;grid-template-columns:2fr 1fr 1fr;gap:8px;margin:18px 0}input,select,button{border:1px solid var(--ink);border-radius:0;background:#fff;padding:13px;font:inherit;color:inherit}button{cursor:pointer}.tabs{display:flex;gap:8px;margin:10px 0 20px}.tabs button.active{background:var(--ink);color:#fff}.meta{display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--ink);padding:12px 0}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:10px;margin-top:12px}.card{background:#fff;border:1px solid var(--ink);padding:16px;cursor:pointer}.card:hover,.card:focus{outline:3px solid var(--red)}.card h3{font:1.2rem Georgia,serif;margin:8px 0}.tag{display:inline-block;border:1px solid currentColor;padding:3px 7px;font-size:.72rem;text-transform:uppercase;font-weight:700}.low{color:var(--low)}.mid{color:var(--mid)}.high{color:var(--high)}.zero{color:#555}.gi{font-size:2.3rem;font-family:Georgia,serif}.panel{border:1px solid var(--ink);padding:20px;margin-top:18px;background:#fff}.rules{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:10px}.rule{border-left:4px solid var(--red);padding:12px;background:#fff}.muted{color:#555;font-size:.9rem;line-height:1.5}@media(max-width:650px){.controls{grid-template-columns:1fr}.grid{grid-template-columns:1fr 1fr}.card{padding:12px}}@media(max-width:390px){.grid{grid-template-columns:1fr}}
</style></head><body><main><header><div class="eyebrow">Le carnet glycémique · édition pratique</div><h1>Indice <em>glycémique</em></h1><p class="intro">Explorez les aliments, leur IG (Indice Glycemique) et les associations proposées dans le document de référence. Simple, rapide, pensé pour le mobile.</p></header><div class="tabs"><button class="active" data-tab="foods">Aliments</button><button data-tab="rules">Règles d’or</button></div><section id="foods"><div class="controls"><input id="search" placeholder="Rechercher un aliment…" autocomplete="off"><select id="cat"><option value="">Toutes les catégories</option></select><select id="level"><option value="">Tous les niveaux</option><option value="bas">IG bas</option><option value="moyen">IG moyen</option><option value="eleve">IG élevé</option><option value="zero">IG nul</option></select></div><div class="meta"><strong id="count">0 aliment</strong><span class="muted">Bas &lt; 55 · Moyen 55–69 · Élevé ≥ 70</span></div><div id="grid" class="grid"></div><article id="detail" class="panel" hidden></article></section><section id="rules" hidden><h2>Les règles d’or</h2><div id="rulesList" class="rules"></div><div id="associations" class="panel"></div><p class="muted" id="note"></p></section></main><script>
let db;const $=s=>document.querySelector(s);const level=v=>v===0?'zero':v<55?'bas':v<70?'moyen':'eleve';function render(){let q=$('#search').value.toLowerCase(),c=$('#cat').value,l=$('#level').value;let a=db.aliments.filter(x=>(!q||x[0].toLowerCase().includes(q))&&(!c||x[1]===c)&&(!l||level(x[2])===l));$('#count').textContent=a.length+' aliment'+(a.length>1?'s':'');$('#grid').innerHTML=a.map((x,i)=>`<button class="card" data-i="${db.aliments.indexOf(x)}"><span class="tag ${level(x[2])}">${level(x[2])==='zero'?'IG nul':'IG '+level(x[2])}</span><h3>${x[0]}</h3><span class="muted">${x[1]}</span><div class="gi ${level(x[2])}">${x[2]}</div></button>`).join('')||'<p>Aucun aliment trouvé.</p>';document.querySelectorAll('.card').forEach(b=>b.onclick=()=>detail(db.aliments[b.dataset.i]))}function detail(x){$('#detail').hidden=false;$('#detail').innerHTML=`<span class="tag ${level(x[2])}">${x[1]}</span><h2>${x[0]}</h2><div class="gi ${level(x[2])}">IG ${x[2]}</div><p>${x[3]}</p><p class="muted">Classement indicatif : IG ${level(x[2])}. La charge glycémique n’est pas chiffrée dans le document.</p>`;$('#detail').scrollIntoView({behavior:'smooth'})}async function init(){db=await fetch('data/aliments.json').then(r=>r.json());[...new Set(db.aliments.map(x=>x[1]))].sort().forEach(x=>$('#cat').insertAdjacentHTML('beforeend',`<option>${x}</option>`));$('#rulesList').innerHTML=db.regles_dor.map(x=>`<div class="rule">${x}</div>`).join('');$('#associations').innerHTML='<h2>Associations</h2>'+db.associations.map(x=>`<p>→ ${x}</p>`).join('');$('#note').textContent=db.note;render()}['search','cat','level'].forEach(x=>$('#'+x).oninput=render);document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{document.querySelectorAll('[data-tab]').forEach(x=>x.classList.remove('active'));b.classList.add('active');$('#foods').hidden=b.dataset.tab!=='foods';$('#rules').hidden=b.dataset.tab!=='rules'});init();
</script></body></html>
