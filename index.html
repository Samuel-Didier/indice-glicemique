<!doctype html>
<html lang="fr">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Indice glycémique — guide complet</title><style>body{font:16px system-ui;max-width:1100px;margin:auto;padding:24px;background:#f8f4ed;color:#1a1a1a}h1,h2{font-family:Georgia,serif}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:10px}.card,.mix,.rule{background:#fff;border:1px solid #ddd;border-radius:8px;padding:14px}.card b{font-size:1.8rem}.controls{display:flex;gap:8px;flex-wrap:wrap}input,select{padding:10px}.mix{margin:8px 0}.tag{font-size:.75rem;text-transform:uppercase}.bas{color:#28634b}.moyen{color:#a66a12}.eleve{color:#a62222}.zero{color:#555}.muted{color:#555}table{border-collapse:collapse;width:100%;margin:8px 0;background:#fff}th,td{border:1px solid #ddd;padding:8px;text-align:left}@media(max-width:600px){body{padding:12px}table{font-size:.9rem}}</style></head>
<body><h1>Indice <em>glycémique</em></h1><p>Tableau des indices glycémiques — guide nutritionnel médical. Établi à titre éducatif — consulter un professionnel de santé pour tout suivi médical.</p><p id="legend"></p><div class="controls"><input id="q" placeholder="Rechercher un aliment" aria-label="Rechercher un aliment"><select id="cat"><option value="">Toutes les catégories</option></select></div><h2>Aliments</h2><div id="foods" class="grid"></div><h2>Maladies métaboliques ciblées</h2><div id="diseases"></div><h2>Mélanges alimentaires</h2><div id="mixes"></div><h2>10 règles d'or anti-pic glycémique</h2><div id="rules"></div><h2>Conseils médicaux essentiels</h2><p id="advice" class="muted"></p><p id="note" class="muted"></p><script>
let d;const $=s=>document.querySelector(s);function level(v){return v===0?'zero':v<=55?'bas':v<=69?'moyen':'eleve'}function esc(v){return String(v).replace(/[&<>\"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',"'":'&#39;'}[c]))}function render(){const q=$('#q').value.toLocaleLowerCase('fr'),c=$('#cat').value;const a=d.aliments.filter(x=>(!q||x[0].toLocaleLowerCase('fr').includes(q))&&(!c||x[1]===c));$('#foods').innerHTML=a.map(x=>`<article class="card"><span class="tag ${level(x[2])}">IG ${level(x[2])}</span><h3>${esc(x[0])}</h3><span class="muted">${esc(x[1])}</span><br><b class="${level(x[2])}">${esc(x[2])}</b><p>${esc(x[3])}</p></article>`).join('')}function mix(title,rows){return `<h3>${title}</h3>`+rows.map(x=>`<article class="mix"><b>${esc(x[0])}</b> — ${esc(x[1])}<p>${esc(x[2])}</p><small>Maladies ciblées: ${esc(x[3])}</small></article>`).join('')}async function init(){const r=await fetch('data/aliments.json');if(!r.ok)throw Error('Impossible de charger les données');d=await r.json();$('#legend').textContent=d.legende.join(' · ');$('#diseases').innerHTML='<ul>'+d.maladies_ciblees.map(x=>`<li>${esc(x)}</li>`).join('')+'</ul>';[...new Set(d.aliments.map(x=>x[1]))].sort((a,b)=>a.localeCompare(b,'fr')).forEach(x=>$('#cat').insertAdjacentHTML('beforeend',`<option value="${esc(x)}">${esc(x)}</option>`));render();$('#mixes').innerHTML=mix('MÉLANGES CRU',d.melanges_cru)+mix('MÉLANGES CUIT',d.melanges_cuit)+'<h3>MÉLANGES COMBINÉS CRU + CUIT</h3>'+d.melanges_combines.map(x=>`<article class="mix"><b>${esc(x[0])}</b><p>Partie crue: ${esc(x[1])}<br>Partie cuite: ${esc(x[2])}</p><p>${esc(x[3])}</p></article>`).join('');$('#rules').innerHTML=d.regles_dor.map((x,i)=>`<div class="rule"><b>${i+1}.</b> ${esc(x)}</div>`).join('');$('#advice').textContent=d.conseils_medicaux;$('#note').textContent=d.note}$('#q').addEventListener('input',render);$('#cat').addEventListener('change',render);init().catch(e=>{document.body.insertAdjacentHTML('beforeend',`<p role="alert">${esc(e.message)}</p>`)})</script></body></html>
