<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Indice glycémique — guide nutritionnel médical</title><style>:root{--cream:#F8F4ED;--ink:#1A1A1A;--red:#B31B1B}*{box-sizing:border-box}body{margin:0;background:var(--cream);color:var(--ink);font:16px system-ui,sans-serif}main{max-width:1100px;margin:auto;padding:28px 18px}header{border-bottom:2px solid var(--ink);padding-bottom:22px}h1,h2{font-family:Georgia,serif}h1{font-size:clamp(2.4rem,7vw,5rem);line-height:.95}h1 em{color:var(--red);font-style:normal}.eyebrow{text-transform:uppercase;letter-spacing:.13em;font-size:.75rem;font-weight:bold}.intro{max-width:700px;line-height:1.55}.controls{display:grid;grid-template-columns:2fr 1fr;gap:8px;margin:18px 0}input,select,button{border:1px solid var(--ink);border-radius:0;background:#fff;padding:13px;font:inherit}button{cursor:pointer}.tabs{display:flex;gap:8px;margin:18px 0}.active{background:var(--ink);color:#fff}.grid,.rules{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:10px}.card,.panel,.rule{background:#fff;border:1px solid var(--ink);padding:16px}.card{text-align:left}.card h3{font:1.15rem Georgia,serif}.tag{font-size:.72rem;text-transform:uppercase;font-weight:bold;color:var(--red)}.gi{font:2.1rem Georgia,serif}.muted{color:#555;font-size:.9rem}.panel{margin-top:20px}.rule{border-left:4px solid var(--red)}section[hidden]{display:none}@media(max-width:650px){.controls{grid-template-columns:1fr}}</style></head><body><main><header><div class="eyebrow">Guide nutritionnel médical</div><h1>Indice <em>glycémique</em></h1><p class="intro">Aliments courants, règles d’or anti-pic glycémique et meilleurs mélanges alimentaires, transcrits du document de référence. Établi à titre éducatif — consulter un professionnel de santé.</p></header><nav class="tabs"><button class="active" data-tab="foods">Aliments</button><button data-tab="guide">Règles et mélanges</button></nav><section id="foods"><div class="controls"><input id="q" placeholder="Rechercher un aliment…"><select id="cat"><option value="">Toutes les catégories</option></select></div><p id="count" class="muted"></p><div id="grid" class="grid"></div></section><section id="guide" hidden><h2>10 règles d’or anti-pic glycémique</h2><div id="rules" class="rules"></div><div id="mix" class="panel"></div></section></main><script>let db;const $=s=>document.querySelector(s),esc=s=>String(s).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));function lvl(v){if(v===0)return'IG nul';if(typeof v==='string')return'IG bas';return v<=55?'IG bas':v<70?'IG moyen':'IG élevé'}function render(){let q=$('#q').value.toLowerCase(),c=$('#cat').value,a=db.aliments.filter(x=>(!q||x[0].toLowerCase().includes(q))&&(!c||x[1]===c));$('#count').textContent=a.length+' aliment'+(a.length>1?'s':'');$('#grid').innerHTML=a.map(x=>`<article class="card"><span class="tag">${lvl(x[2])}</span><h3>${esc(x[0])}</h3><div class="muted">${esc(x[1])}</div><div class="gi">${esc(x[2])}</div><p>${esc(x[3])}</p></article>`).join('')}function list(title,key){return `<h2>${title}</h2><ol>${db[key].map(x=>`<li>${esc(x)}</li>`).join('')}</ol>`}async function init(){db=await fetch('data/aliments.json').then(r=>r.json());[...new Set(db.aliments.map(x=>x[1]))].sort().forEach(x=>$('#cat').insertAdjacentHTML('beforeend',`<option>${esc(x)}</option>`));$('#rules').innerHTML=db.regles_dor.map(x=>`<div class="rule">${esc(x)}</div>`).join('');$('#mix').innerHTML=list('Mélanges crus','melanges_crus')+list('Mélanges cuits — 10 entrées du PDF','melanges_cuits')+list('Repas combinés cru + cuit','repas_combines');render()}$('#q').oninput=render;$('#cat').oninput=render;document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{document.querySelectorAll('[data-tab]').forEach(x=>x.classList.remove('active'));b.classList.add('active');$('#foods').hidden=b.dataset.tab!=='foods';$('#guide').hidden=b.dataset.tab!=='guide'});init()</script></body></html>
