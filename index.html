<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Indice — Le carnet glycémique</title><link rel="stylesheet" href="css/style.css"></head><body><main><header><div class="eyebrow">Le carnet glycémique · édition pratique</div><h1>Indice <em>glycémique</em></h1><p class="intro">Explorez les aliments, leur IG et les associations proposées. Simple, rapide, pensé pour le mobile.</p></header><div class="tabs"><button class="active" data-tab="foods">Aliments</button><button data-tab="rules">Règles d’or</button></div><section id="foods"><div class="controls"><input id="search" placeholder="Rechercher un aliment…" autocomplete="off"><select id="cat"><option value="">Toutes les catégories</option></select><select id="level"><option value="">Tous les niveaux</option><option value="bas">IG bas</option><option value="moyen">IG moyen</option><option value="eleve">IG élevé</option><option value="zero">IG nul</option></select></div><div class="meta"><strong id="count">0 aliment</strong><span class="muted">Bas &lt; 55 · Moyen 55–69 · Élevé ≥ 70</span></div><div id="grid" class="grid"></div><article id="detail" class="panel" hidden></article></section><section id="rules" hidden><h2>Les règles d’or</h2><div id="rulesList" class="rules"></div><p class="muted" id="note"></p></section></main><script src="js/data.js"></script><script>let db=window.APP_DATA;const $=s=>document.querySelector(s);const level=v=>v===0?'zero':v<55?'bas':v<70?'moyen':'eleve';function render(){let q=$('#search').value.toLowerCase(),c=$('#cat').value,l=$('#level').value,a=db.aliments.filter(x=>(!q||x[0].toLowerCase().includes(q))&&(!c||x[1]===c)&&(!l||level(x[2])===l));$('#count').textContent=a.length+' aliment'+(a.length>1?'s':'');$('#grid').innerHTML=a.map(x=>`<button class="card"><span class="tag ${level(x[2])}">IG ${level(x[2])}</span><h3>${x[0]}</h3><span class="muted">${x[1]}</span><div class="gi ${level(x[2])}">${x[2]}</div></button>`).join('');document.querySelectorAll('.card').forEach((b,i)=>b.onclick=()=>{$('#detail').hidden=false;$('#detail').innerHTML=`<h2>${a[i][0]}</h2><div class="gi ${level(a[i][2])}">IG ${a[i][2]}</div><p>${a[i][3]}</p>`;$('#detail').scrollIntoView({behavior:'smooth'})})}function init(){[...new Set(db.aliments.map(x=>x[1]))].sort().forEach(x=>$('#cat').insertAdjacentHTML('beforeend',`<option>${x}</option>`));$('#rulesList').innerHTML=db.regles_dor.map(x=>`<div class="rule">${x}</div>`).join('');$('#note').textContent=db.note||'';render()}['search','cat','level'].forEach(x=>$('#'+x).oninput=render);document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{document.querySelectorAll('[data-tab]').forEach(x=>x.classList.remove('active'));b.classList.add('active');$('#foods').hidden=b.dataset.tab!=='foods';$('#rules').hidden=b.dataset.tab!=='rules'});document.addEventListener('DOMContentLoaded',init);</script></body></html>
